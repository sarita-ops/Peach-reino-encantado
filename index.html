<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peach - Reino Encantado</title>
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <div id="tela">
      <img src="imagens/fundoh.png" id="fundo" />

      <img src="imagens/nuvens.png" id="nuvens" />

      <img src="imagens/princess-peach.gif" id="peach" />

      <img src="imagens/plantinha.gif" id="plantinha" />

      <div class="moeda moeda1">♥</div>

      <div class="moeda moeda2">♥</div>

      <div class="moeda moeda3">♥</div>

      <div id="pontuacao">Pontos: 0</div>
      <div id="cronometro">Tempo: 90</div>

      <div id="inicio">
        <h1>Peach: Reino Encantado</h1>
        <p>Ajude a Peach a atravessar o reino!</p>
        <button id="botaoIniciar">Comecar Jogo</button>
      </div>

      <div id="fim">
        <h1>Game Over, que pena!</h1>
        <img src="imagens/gameoverp.png" id="imagemgameover" />
        <p id="pontuacaoFinal">Pontuacao: 0</p>
        <button id="botaoReiniciar">Jogar Novamente?</button>
      </div>
    </div>

    <script src="scripts.js"></script>
  </body>
</html>
